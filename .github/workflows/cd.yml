
name: CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deployment-access:
    name: Verify EC2 access
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [ -z "$EC2_HOST" ]; then
            echo "EC2_HOST secret is empty"
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "EC2_USER secret is empty"
            exit 1
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "EC2_SSH_KEY secret is empty"
            exit 1
          fi

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          if ! ssh-keygen -y -f "$HOME/.ssh/ec2_key" > /dev/null; then
            echo "SSH key is invalid or incorrectly formatted"
            exit 1
          fi

          if ! ssh-keyscan -T 10 -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null; then
            echo "Could not retrieve SSH host key; check EC2_HOST and network access"
            exit 1
          fi

          chmod 600 "$HOME/.ssh/known_hosts"
          echo "SSH configuration checks passed"

      - name: Verify server and deployment directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o BatchMode=yes \
            "$EC2_USER@$EC2_HOST" \
            'printf "SSH connection successful\n"; test -d "$HOME/SBOMDelta-deploy"; printf "Deployment directory exists\n"'
