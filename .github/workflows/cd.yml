
name: CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-deployment-access:
    name: Verify EC2 access through AWS SSM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::153844980148:role/SBOMDelta-GitHub-Deploy-Role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify EC2 SSM connectivity
        run: |
          aws ssm send-command \
            --region ap-south-1 \
            --instance-ids i-0296a251d132fc195 \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["printf \"SSM connection successful\\n\"; test -d /home/ec2-user/SBOMDelta-deploy && printf \"Deployment directory exists\\n\""]' \
            --comment "SBOMDelta deployment connectivity check" \
            --query 'Command.CommandId' \
            --output text
